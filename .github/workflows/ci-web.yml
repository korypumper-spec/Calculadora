name: CI Web (Build & Tests)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build-web:
    name: Lint, Tests & Vite Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Run unit tests (Vitest)
        run: npm test

      - name: Build production web bundle
        run: npm run build

      - name: Verify built web bundle and startup/icon assets
        run: |
          test -s dist/index.html
          test -s dist/assets/aistudio/a_clean_transparent_background_png_style_illustrat_7ae40feb.png
          test -s dist/assets/aistudio/a_crisp_colorful_glossy_cartoon_like_app_icon_d_fe3994ea.png

      - name: Upload web dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: drk-web-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
