name: Build Android (Capacitor APK / AAB)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Compilar AAB de lanzamiento (requiere secretos de firma)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verify generated web assets and launcher icons
        run: |
          test -s dist/index.html
          test -s android/app/src/main/assets/public/index.html
          test -s android/app/src/main/assets/public/assets/aistudio/a_clean_transparent_background_png_style_illustrat_7ae40feb.png
          test -s android/app/src/main/assets/public/assets/aistudio/a_crisp_colorful_glossy_cartoon_like_app_icon_d_fe3994ea.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: drk-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  build-android-release:
    name: Build Signed Android Release AAB
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.build_release == true || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build web application & sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Verify signing secrets and build Release AAB
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Falta el secreto ANDROID_KEYSTORE_BASE64; se compilará AAB release sin firmar."
            cd android
            ./gradlew bundleRelease --no-daemon
          else
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "${{ github.workspace }}/android/app/release.keystore"
            cd android
            ./gradlew bundleRelease --no-daemon \
              -Pandroid.injected.signing.store.file="${{ github.workspace }}/android/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          fi

      - name: Verify Release AAB
        run: test -s android/app/build/outputs/bundle/release/app-release.aab

      - name: Upload Release AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: drk-android-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
